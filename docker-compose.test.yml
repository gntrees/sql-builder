services:
  postgres:
    image: postgres:16-alpine
    container_name: gntrees-sql-builder-postgres
    environment:
      POSTGRES_USER: gntrees
      POSTGRES_PASSWORD: gntrees
      POSTGRES_DB: gntrees_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gntrees -d gntrees_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    container_name: gntrees-sql-builder-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gntrees_test
      MYSQL_USER: gntrees
      MYSQL_PASSWORD: gntrees
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugntrees", "-pgntrees"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  migrate-postgres:
    image: amacneil/dbmate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/db
    environment:
      DATABASE_URL: postgres://gntrees:gntrees@postgres:5432/gntrees_test?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations/postgres
      DBMATE_NO_DUMP_SCHEMA: "1"
    command: up

  migrate-mysql:
    image: amacneil/dbmate
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./db:/db
    environment:
      DATABASE_URL: mysql://gntrees:gntrees@mysql:3306/gntrees_test
      DBMATE_MIGRATIONS_DIR: /db/migrations/mysql
      DBMATE_NO_DUMP_SCHEMA: "1"
    command: up
