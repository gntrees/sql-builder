name: drizzle

# Only the drizzle port and its parity harness are affected by these paths.
# `lt/` (the sql-builder port) keeps its own workflow and is not touched here.
on:
  push:
    branches: [experiment/drizzle-port]
    paths:
      - "lt-drizzle/**"
      - "docs/plans/drizzle-port.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/drizzle.yml"
  pull_request:
    paths:
      - "lt-drizzle/**"
      - "docs/plans/drizzle-port.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/drizzle.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # K20: the compiler is pinned to a commit, not to `main`, so the
      # experiment cannot break silently under a moving language.
      - uses: actions/checkout@v4
        with:
          repository: gntrees/lingua-tungga
          ref: 09bffc7
          path: .lt-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".lt-src -> target"
      - name: build lt
        run: set -o pipefail; cargo build --release --manifest-path .lt-src/Cargo.toml --bin lt 2>&1 | tee build.log
      - run: echo "$GITHUB_WORKSPACE/.lt-src/target/release" >> "$GITHUB_PATH"
      - run: bun install
      - name: parity gate
        run: set -o pipefail; bash lt-drizzle/verify.sh 2>&1 | tee verify.log
      - name: annotate failure
        if: failure()
        run: |
          lines="$(grep -ahE 'error(\[|:)|error TS|FAIL|failed|Expected|Received|mismatch' *.log 2>/dev/null | tail -10)"
          if [ -z "$lines" ]; then lines="$(tail -10 *.log 2>/dev/null)"; fi
          printf '%s\n' "$lines" | sed 's/^/::error::/' || true
          exit 0

  database:
    name: database (postgres + mysql)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/checkout@v4
        with:
          repository: gntrees/lingua-tungga
          ref: 09bffc7
          path: .lt-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".lt-src -> target"
      - name: build lt
        run: cargo build --release --manifest-path .lt-src/Cargo.toml --bin lt
      - run: echo "$GITHUB_WORKSPACE/.lt-src/target/release" >> "$GITHUB_PATH"
      - run: bun install
      # The differential proves the SQL text matches; this proves it runs.
      - name: roundtrip
        run: bash lt-drizzle/verify-db.sh
