name: drizzle-v2

# Only the v2 port and its harness are affected by these paths. The v1 port
# keeps its own workflow.
on:
  push:
    branches: [experiment/drizzle-port-v2]
    paths:
      - "lt-drizzle-v2/**"
      - "docs/plans/drizzle-port-v2.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/drizzle-v2.yml"
  pull_request:
    paths:
      - "lt-drizzle-v2/**"
      - "docs/plans/drizzle-port-v2.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/drizzle-v2.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # V1: the compiler is pinned to the v0.3.0 commit.
      - uses: actions/checkout@v4
        with:
          repository: gntrees/lingua-tungga
          ref: d11a4c99b77f1792cedc66e442cfce5a204ef27c
          path: .lt-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".lt-src -> target"
      - name: build lt
        run: set -o pipefail; cargo build --release --manifest-path .lt-src/Cargo.toml --bin lt 2>&1 | tee build.log
      - run: echo "$GITHUB_WORKSPACE/.lt-src/target/release" >> "$GITHUB_PATH"
      # The repo-level install pulls @gntrees/method-chain from the private
      # local registry. The v2 gate only needs drizzle-orm and TypeScript.
      - name: install v2 toolchain
        run: |
          set -o pipefail
          rm -rf .v2-deps node_modules
          mkdir -p .v2-deps
          printf '{"name":"v2-toolchain","private":true}\n' > .v2-deps/package.json
          ( cd .v2-deps && bun add drizzle-orm@0.44.4 typescript@5 2>&1 | tee ../install.log )
          mv .v2-deps/node_modules ./node_modules
          rm -rf .v2-deps
      - name: parity gate
        run: set -o pipefail; bash lt-drizzle-v2/verify.sh 2>&1 | tee verify.log
      - name: annotate failure
        if: failure()
        run: |
          lines="$(grep -ahE 'error(\[|:)|error TS|FAIL|failed|Expected|Received|mismatch' *.log 2>/dev/null | tail -10)"
          if [ -z "$lines" ]; then lines="$(tail -10 *.log 2>/dev/null)"; fi
          printf '%s\n' "$lines" | sed 's/^/::error::/' || true
          exit 0

  database:
    name: database (postgres + mysql)
    # DB roundtrips are heavy and available locally via `bun run lt-drizzle-v2:db`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/checkout@v4
        with:
          repository: gntrees/lingua-tungga
          ref: d11a4c99b77f1792cedc66e442cfce5a204ef27c
          path: .lt-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".lt-src -> target"
      - name: build lt
        run: cargo build --release --manifest-path .lt-src/Cargo.toml --bin lt
      - run: echo "$GITHUB_WORKSPACE/.lt-src/target/release" >> "$GITHUB_PATH"
      # The repo-level install pulls @gntrees/method-chain from the private
      # local registry. The v2 gate only needs drizzle-orm and TypeScript.
      - name: install v2 toolchain
        run: |
          set -o pipefail
          rm -rf .v2-deps node_modules
          mkdir -p .v2-deps
          printf '{"name":"v2-toolchain","private":true}\n' > .v2-deps/package.json
          ( cd .v2-deps && bun add drizzle-orm@0.44.4 typescript@5 2>&1 | tee ../install.log )
          mv .v2-deps/node_modules ./node_modules
          rm -rf .v2-deps
      - name: roundtrip
        run: bash lt-drizzle-v2/verify-db.sh
